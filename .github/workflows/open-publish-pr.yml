name: Open Publish PR
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Type'
        required: true
        type: choice
        options:
          - 'PATCH'
          - 'MINOR'
          - 'MAJOR'

jobs:
  open-publish-pr:
    uses: helloextend/gha-reusable-workflows/.github/workflows/open-publish-pr.yml@v13.28.1
    with:
      
      type: ${{ github.event.inputs.type }}
    secrets: inherit
